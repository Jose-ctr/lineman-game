<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Lineman Game ⚡</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #87CEEB; }
        canvas { display: block; }
        #score { position: absolute; top: 10px; left: 10px; color: white; font-size: 24px; font-family: Arial; z-index: 100; }
        #donateBtn { position: absolute; top: 10px; right: 10px; background: red; color: white; border: none; padding: 8px 12px; border-radius: 5px; z-index: 100; }
        .controls { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: center; gap: 20px; z-index: 100; }
        .controls button { width: 60px; height: 60px; font-size: 24px; }
        #gameOver { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); color: white; padding: 20px; border-radius: 10px; display: none; text-align: center; z-index: 200; }
    </style>
</head>
<body>
    <div id="score">SCORE: 0</div>
    <button id="donateBtn" onclick="showDonateOptions()">⚡ SUPPORT DEVELOPER</button>
    
    <div class="controls">
        <button id="btnUp">↑</button>
        <button id="btnDown">↓</button>
    </div>

    <div id="gameOver">
        <h2>GAME OVER</h2>
        <p id="finalScore"></p>
        <button onclick="location.reload()">RESTART</button>
    </div>

<script>
let player, score = 0, gameOver = false;
let upPressed = false, downPressed = false;

function showDonateOptions() {
    const mpesaNumber = "0707649890";
    navigator.clipboard.writeText(mpesaNumber);
    alert(`ASANTE SANA! 🙏\n\nM-PESA NUMBER: ${mpesaNumber}\n\nNumber copied! Open M-PESA > Send Money > Paste number to support.`);
}

function getRating(score) {
    if(score >= 1000) return {text: "LEGENDARY! 👑⚡", color: "#ffd700"};
    else if(score >= 500) return {text: "EXCELLENT! ⚡🔥", color: "#ff5500"};
    else if(score >= 100) return {text: "GOOD! 💪", color: "#ffaa00"};
    else if(score >= 20) return {text: "FAIR 🙂", color: "#00aaff"};
    else return {text: "KEEP TRYING! 💯", color: "#ffffff"};
}

const config = {
    type: Phaser.AUTO,
    width: window.innerWidth,
    height: window.innerHeight - 100,
    backgroundColor: '#87CEEB',
    physics: {
        default: 'arcade',
        arcade: { gravity: { y: 0 }
    },
    scene: {
        preload: preload,
        create: create,
        update: update
    }
};

const game = new Phaser.Game(config);

function preload() {}

function create() {
    // PLAYER - YELLOW SQUARE
    player = this.physics.add.rectangle(100, 300, 40, 40, 0xffff00);
    player.body.setCollideWorldBounds(true);

    // MOBILE BUTTONS
    document.getElementById('btnUp').addEventListener('touchstart', () => upPressed = true);
    document.getElementById('btnUp').addEventListener('touchend', () => upPressed = false);
    document.getElementById('btnDown').addEventListener('touchstart', () => downPressed = true);
    document.getElementById('btnDown').addEventListener('touchend', () => downPressed = false);

    // KEYBOARD TOO
    this.input.keyboard.on('keydown-UP', () => upPressed = true);
    this.input.keyboard.on('keyup-UP', () => upPressed = false);
    this.input.keyboard.on('keydown-DOWN', () => downPressed = true);
    this.input.keyboard.on('keyup-DOWN', () => downPressed = false);
}

function update() {
    if(gameOver) return;

    if(upPressed) {
        player.y -= 5;
        score += 1;
    }
    if(downPressed) {
        player.y += 5;
    }

    document.getElementById('score').innerText = 'SCORE: ' + score;

    // GAME OVER
    if(player.y < 0 || player.y > config.height) {
        gameOver = true;
        let rating = getRating(score);
        document.getElementById('finalScore').innerText = 'Score: ' + score + ' - ' + rating.text;
        document.getElementById('gameOver').style.display = 'block';
    }
}
</script>
</body>
</html>
