<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;font-family:Arial;background:#87CEEB;overflow:hidden}
#gameArea{position:relative;width:100vw;height:70vh;background:linear-gradient(#87CEEB,#228B22)}
#score{position:absolute;top:10px;left:10px;font-size:24px;font-weight:bold;color:#000}
#mpesa{position:absolute;top:10px;right:10px;font-size:16px;font-weight:bold;color:#E60000;background:#fff;padding:5px 10px;border-radius:5px}
#gameover{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10;font-size:40px;color:red;display:none;font-weight:bold}
#restart{position:absolute;top:60%;left:50%;transform:translate(-50%,-50%);z-index:10;display:none;padding:10px 20px;font-size:18px}
.gameBtn{position:absolute;bottom:20px;width:80px;height:80px;font-size:30px;border-radius:50%;border:none;background:#333;color:#fff}
#up{left:20px;bottom:120px}
#down{left:20px}
#jump{right:20px}
#chatArea{height:30vh;background:#f1f1f1;display:flex;flex-direction:column}
.header{background:#075E54;color:#fff;padding:10px;font-weight:bold}
.chat{flex:1;overflow-y:auto;padding:10px}
.msg{background:#DCF8C6;padding:8px 12px;border-radius:10px;margin:5px 0;max-width:80%}
.msg.bot{background:#fff}
.input-area{display:flex;padding:10px;background:#fff}
#input{flex:1;padding:10px;border:1px solid #ccc;border-radius:20px}
.input-area button{background:#075E54;color:#fff;border:none;padding:10px 15px;border-radius:50%;margin-left:5px}
canvas{position:absolute;top:0;left:0}
  #gameover{display:none;z-index:10;font-size:40px;color:red;font-weight:bold}
#restart{display:none;z-index:10;padding:10px 20px;font-size:18px}
</style>
</head>
<body>
<div id="gameArea">
  <div id="score">SCORE: 0</div>
  <div id="mpesa">M-PESA: 0707649890</div>
  <div id="gameover">GAME OVER</div>
  <button id="restart">RESTART</button>
  <button id="up" class="gameBtn">↑</button>
  <button id="down" class="gameBtn">↓</button>
  <button id="jump" class="gameBtn">JUMP</button>
  <canvas id="c"></canvas>
</div>

<div id="chatArea">
  <div class="header">🤖 Lineman Bot</div>
  <div class="chat" id="chat">
    <div class="msg bot">Yo! Welcome to Mombasa Lineman Game. Tap UP to start!</div>
  </div>
  <div class="input-area">
    <input id="input" placeholder="Ask me anything...">
    <button onclick="send()">➤</button>
  </div>
</div>

<script>
let c=document.getElementById('c'),x=c.getContext('2d');
c.width=innerWidth; c.height=document.getElementById('gameArea').offsetHeight;
let px=100,py=c.height/2,vy=0,s=0,up=0,down=0,game=1;
let gap=200; let poleDistance=350;
let poles=[{x:400,gapY:200},{x:400+poleDistance,gapY:250}];

// YOUR PHOTO - FROM FILE
let linemanImg = new Image();
linemanImg.src = "lineman.png";

function loop(){
  if(game){
    x.clearRect(0,0,c.width,c.height);
    
    // Gravity
    if(up) vy=-8;
    if(down) vy=8;
    if(!up && !down) vy+=0.5;
    py+=vy;
    
    // Draw YOU
    x.drawImage(linemanImg, px-25, py-25, 50, 50);
    
    // Draw Poles
    poles.forEach(p=>{
      x.fillStyle="#555";
      x.fillRect(p.x,0,40,p.gapY-gap/2);
      x.fillRect(p.x,p.gapY+gap/2,40,c.height);
      p.x-=5;
      if(p.x<-40){p.x=400+poleDistance; p.gapY=Math.random()*c.height}
      // Collision
      if(px> p.x && px< p.x+40 && (py< p.gapY-gap/2 || py> p.gapY+gap/2)) gameOver()
    });
    
    s++; document.getElementById('score').innerText="SCORE: "+Math.floor(s/10);
  }
  requestAnimationFrame(loop)
}
function gameOver(){
  game=0;
  document.getElementById('gameover').style.display='block';
  document.getElementById('restart').style.display='block';
}

// Controls
document.getElementById('up').ontouchstart=()=>up=1;
document.getElementById('up').ontouchend=()=>up=0;
document.getElementById('down').ontouchstart=()=>down=1;
document.getElementById('down').ontouchend=()=>down=0;
document.getElementById('jump').onclick=()=>{if(game)vy=-10};

function resetGame(){
  game=1; s=0; px=100; py=c.height/2; vy=0;
  poles=[{x:400,gapY:200},{x:400+poleDistance,gapY:250}];
  document.getElementById('gameover').style.display='none';
  document.getElementById('restart').style.display='none';
}
document.getElementById('restart').onclick=resetGame;
  game=1; s=0; px=100; py=c.height/2; vy=0;
  poles=[{x:400,gapY:200},{x:400+poleDistance,gapY:250}];
  document.getElementById('gameover').style.display='none';
  document.getElementById('restart').style.display='none';
}
document.getElementById('restart').onclick=resetGame;

// Chat
function send(){
  let v=document.getElementById('input').value;
  if(v){document.getElementById('chat').innerHTML+=`<div class="msg">${v}</div>`;document.getElementById('input').value=''}
}
loop();
</script>
</body>
</html>
