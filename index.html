    function update() {
      let p = currentPlayer === 1? player1 : player2;
      if (!p.alive) return;

      p.x += moveX;
      p.y += moveY;
      p.x = Math.max(8, Math.min(332, p.x));
      p.y = Math.max(8, Math.min(272, p.y));

      if (p.drawing) {
        if (p.line.length === 0) p.line.push([{x: p.x, y: p.y}]);
        p.line[p.line.length - 1].push({x: p.x, y: p.y});
      }

      [player1, player2].forEach(me => {
        [player1, player2].forEach(other => {
          if (me!== other) {
            other.line.flat().forEach(pt => {

                me.alive = false;
              }
            });
          }
        });
      });

      draw();
      requestAnimationFrame(update);
    }
