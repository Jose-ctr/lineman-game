<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lineman LOCAL 2P</title>
<style>
body{background:#000;color:#0f0;text-align:center;margin:0;padding:10px;font-family:Arial}
h1{margin:5px;font-size:24px}
canvas{background:#000;border:2px solid #0f0;display:block;margin:10px auto}
button{padding:14px 20px;margin:4px;font-size:18px;border:none;border-radius:8px;font-weight:bold}
#draw{background:orange;color:#000;width:180px;height:65px;font-size:24px}
.controls button{width:65px;height:65px;background:#222;color:#fff;font-size:26px}
</style>
</head>
<body>
<h1>LINEMAN</h1>
<div>Room: LOCAL - 2 Players</div>
<canvas id="c" width="340" height="280"></canvas>

<div class="controls">
<button id="up">↑</button><br>
<button id="left">←</button>
<button id="down">↓</button>
<button id="right">→</button>
</div>
<button id="draw">DRAW</button>
<button id="reset">RESET</button>

<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let p1={x:90,y:140,col:'cyan',alive:true,line:[],drawing:false};
let p2={x:250,y:140,col:'orange',alive:true,line:[],drawing:false};
let keys={};

function drawGame(){
ctx.fillStyle='#000';ctx.fillRect(0,0,340,280);
[p1,p2].forEach(p=>{
if(!p.alive)return;
ctx.fillStyle=p.col;
ctx.beginPath();ctx.arc(p.x,p.y,7,0,Math.PI*2);ctx.fill(); // RAIA
ctx.strokeStyle=p.col;ctx.lineWidth=3;
p.line.forEach(seg=>{ctx.beginPath();ctx.moveTo(seg[0].x,seg[0].y);seg.forEach(pt=>ctx.lineTo(pt.x,pt.y));ctx.stroke();})
});
}
function move(p,dx,dy){
if(!p.alive)return;
p.x+=dx;p.y+=dy;
p.x=Math.max(0,Math.min(340,p.x));p.y=Math.max(0,Math.min(280,p.y));
if(p.drawing){
if(p.line.length==0)p.line.push([{x:p.x,y:p.y}]);
p.line[p.line.length-1].push({x:p.x,y:p.y});
}
}
function checkCollision(){
[p1,p2].forEach(me=>[p1,p2].forEach(other=>{
if(me==other)return;
other.line.flat().forEach(pt=>{if(Math.abs(me.x-pt.x)<6&&Math.abs(me.y-pt.y)<6)me.alive=false;})
}))}
setInterval(()=>{
if(keys['w'])move(p1,0,-2.5);if(keys['s'])move(p1,0,2.5);if(keys['a'])move(p1,-2.5,0);if(keys['d'])move(p1,2.5,0);
if(keys['ArrowUp'])move(p2,0,-2.5);if(keys['ArrowDown'])move(p2,0,2.5);if(keys['ArrowLeft'])move(p2,-2.5,0);if(keys['ArrowRight'])move(p2,2.5,0);
checkCollision();drawGame();
},33);

window.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key==' ')p1.drawing=true;if(e.key=='Shift')p2.drawing=true;});
window.addEventListener('keyup',e=>{keys[e.key]=false;if(e.key==' ')p1.drawing=false;if(e.key=='Shift')p2.drawing=false;});

document.getElementById('draw').ontouchstart=()=>p1.drawing=true;
document.getElementById('draw').ontouchend=()=>p1.drawing=false;
['up','down','left','right'].forEach(id=>{
document.getElementById(id).ontouchstart=()=>keys[id]=true;
document.getElementById(id).ontouchend=()=>keys[id]=false;
});
document.getElementById('reset').onclick=()=>location.reload();
drawGame(); // DRAW MARA MOJA MWANZONI
alert("Player 1: W A S D + SPACE\nPlayer 2: Arrows + SHIFT\nPhone: Shika DRAW + mishale")
</script>
</body>
</html>
