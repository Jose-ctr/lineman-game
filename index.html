<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lineman 2 Player Online</title>
<style>
body { background:#0a0a0a; color:white; font-family:Arial; text-align:center; margin:0; }
h1 { color:#00ff88; text-shadow:0 0 10px #00ff88; }
#canvas { background:#111; border:2px solid #00ff88; display:block; margin:10px auto; }
button { padding:12px 20px; margin:5px; font-size:16px; border:none; border-radius:8px; cursor:pointer; font-weight:bold; }
#create { background:#00aaff; color:white; }
#join { background:#00ddaa; color:white; }
#restart { background:#ff0044; color:white; }
#drawBtn { background:orange; color:black; font-size:20px; padding:15px 30px; display:none; }
.controls button { width:60px; height:60px; background:#333; color:white; font-size:24px; }
#status { color:#00ff88; font-size:18px; margin:10px; }
</style>
</head>
<body>
<h1>⚡ LINEMAN 2 PLAYER ONLINE ⚡</h1>
<div id="status">Connect to internet</div>
<button id="create">Create Room</button>
<input id="roomInput" placeholder="Enter Room Code">
<button id="join">Join Room</button>
<button id="restart">Restart</button>
<div>Room Code: <span id="roomCode">-</span></div>
<canvas id="canvas" width="600" height="400"></canvas>
<div class="controls">
  <button id="up">↑</button><br>
  <button id="left">←</button>
  <button id="down">↓</button>
  <button id="right">→</button>
</div>
<button id="drawBtn">DRAW</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, onValue, get, child } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyB-EXAMPLE-KEY",
  authDomain: "lineman-game.firebaseapp.com",
  databaseURL: "https://lineman-game-default-rtdb.firebaseio.com",
  projectId: "lineman-game",
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let roomId = null;
let player = null;
let gameState = { p1:{x:100,y:200,color:'cyan',alive:true,lines:[]}, p2:{x:500,y:200,color:'orange',alive:true,lines:[]} };
let keys = {};
let drawing = false;

document.getElementById('create').onclick = () => {
  roomId = Math.random().toString(36).substr(2,4).toUpperCase();
  player = 'p1';
  set(ref(db, 'rooms/' + roomId), gameState);
  document.getElementById('roomCode').innerText = roomId;
  document.getElementById('status').innerText = 'Room Created! Waiting for Player 2...';
  listen();
};

document.getElementById('join').onclick = () => {
  roomId = document.getElementById('roomInput').value.toUpperCase();
  player = 'p2';
  document.getElementById('roomCode').innerText = roomId;
  document.getElementById('status').innerText = 'Game Started! Hold DRAW + Move';
  document.getElementById('drawBtn').style.display = 'inline-block';
  listen();
};

function listen(){
  onValue(ref(db, 'rooms/' + roomId), (snap) => {
    if(snap.exists()){
      gameState = snap.val();
      draw();
      if(gameState.p1 && gameState.p2) document.getElementById('status').innerText = 'Game Started! Hold DRAW + Move';
    }
  });
}

function draw(){
  ctx.fillStyle = '#111'; ctx.fillRect(0,0,600,400);
  ['p1','p2'].forEach(p => {
    if(!gameState[p] ||!gameState[p].alive) return;
    ctx.fillStyle = gameState[p].color;
    ctx.beginPath(); ctx.arc(gameState[p].x, gameState[p].y, 8, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = gameState[p].color; ctx.lineWidth = 3;
    gameState[p].lines.forEach(line => {
      ctx.beginPath(); ctx.moveTo(line[0].x, line[0].y);
      line.forEach(pt => ctx.lineTo(pt.x, pt.y)); ctx.stroke();
    });
  });
}

function move(dx,dy){
  if(!player ||!gameState[player] ||!gameState[player].alive) return;
  gameState[player].x += dx; gameState[player].y += dy;
  if(drawing){
    if(gameState[player].lines.length === 0) gameState[player].lines.push([{x:gameState[player].x,y:gameState[player].y}]);
    gameState[player].lines[gameState[player].lines.length-1].push({x:gameState[player].x,y:gameState[player].y});
  }
  set(ref(db, 'rooms/' + roomId), gameState);
}

document.addEventListener('keydown', e => { keys[e.key] = true; if(e.key === ' ') drawing = true; });
document.addEventListener('keyup', e => { keys[e.key] = false; if(e.key === ' ') drawing = false; });

setInterval(() => {
  if(keys['ArrowUp'] || keys['w']) move(0,-3);
  if(keys['ArrowDown'] || keys['s']) move(0,3);
  if(keys['ArrowLeft'] || keys['a']) move(-3,0);
  if(keys['ArrowRight'] || keys['d']) move(3,0);
}, 50);

['up','down','left','right'].forEach(id => {
  document.getElementById(id).onmousedown = () => keys[id] = true;
  document.getElementById(id).onmouseup = () => keys[id] = false;
});
document.getElementById('drawBtn').onmousedown = () => drawing = true;
document.getElementById('drawBtn').onmouseup = () => drawing = false;
</script>
</body>
</html>
