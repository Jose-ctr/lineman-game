<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Lineman 2 Player Online</title>
<style>
    body { margin:0; background:#111; color:white; font-family:Arial; text-align:center; overflow:hidden; touch-action: none; }
    canvas { background:#000; border:2px solid #444; display:block; margin:10px auto; max-width:95vw; max-height:50vh; }
    button { padding:12px 20px; font-size:16px; margin:5px; background:#00aaff; border:none; color:white; border-radius:8px; cursor:pointer; font-weight:bold; }
    button:active { background:#0088cc; }
    #roomCode { font-size:22px; color:#0f0; font-weight:bold; margin:10px; }
    #status { margin:10px; font-size:18px; color:#ffaa00; }
    input { padding:12px; border-radius:5px; border:none; font-size:16px; width:200px; }
 .mobile-controls { display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px; max-width:400px; margin:10px auto; }
.btn { background:#333; border:2px solid #555; padding:20px; border-radius:10px; font-size:24px; user-select:none; color:white; }
.btn:active { background:#555; }
    #drawBtn { background:#ff8800; }
    #drawBtn.active { background:#ffaa00; }
</style>
<script type="importmap">
{
  "imports": {
    "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
    "firebase/database": "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js"
  }
}
</script>
</head>
<body>
<h1>⚡ LINEMAN 2 PLAYER ONLINE ⚡</h1>
<div id="status">Click "Create Room" or enter Code</div>
<div>
    <button onclick="createRoom()">Create Room</button>
    <input id="joinInput" placeholder="Enter Room Code">
    <button onclick="joinRoom()">Join Room</button>
    <button onclick="restartGame()" style="background:#ff4444;">Restart</button>
</div>
<div id="roomCode"></div>
<canvas id="gameCanvas" width="800" height="600"></canvas>

<div class="mobile-controls">
    <div></div>
    <button class="btn" ontouchstart="keys['w']=true" ontouchend="keys['w']=false">↑</button>
    <div></div>
    <button class="btn" ontouchstart="keys['a']=true" ontouchend="keys['a']=false">←</button>
    <button class="btn" ontouchstart="keys['s']=true" ontouchend="keys['s']=false">↓</button>
    <button class="btn" ontouchstart="keys['d']=true" ontouchend="keys['d']=false">→</button>
    <div></div>
    <button class="btn" id="drawBtn" ontouchstart="keys[' ']=true; this.classList.add('active')" ontouchend="keys[' ']=false; this.classList.remove('active')">DRAW</button>
</div>

<script type="module">
import { initializeApp } from "firebase/app";
import { getDatabase, ref, set, onValue, update, push } from "firebase/database";

const firebaseConfig = {
  apiKey: "AIzaSyALO95KtE3U9y8nAxtiVEjvPAx-fQ09srA",
  authDomain: "lineman-game.firebaseapp.com",
  databaseURL: "https://lineman-game-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "lineman-game"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let roomId = null;
let playerId = null;
let gameState = { players:{}, lines:{} };
let keys = {};
let lastPos = {};

window.createRoom = () => {
    roomId = Math.random().toString(36).substring(2, 6).toUpperCase();
    playerId = 'p1';
    document.getElementById('roomCode').innerText = 'Room Code: ' + roomId;
    document.getElementById('status').innerText = 'Creating Room...';
    set(ref(db, 'rooms/' + roomId), { 
        players: { p1: { x:100, y:300, color:'cyan', alive:true } },
        lines: {}
    }).then(()=>{
        document.getElementById('status').innerText = 'Room Created! Waiting for Player 2...';
    }).catch((e)=>{
        document.getElementById('status').innerText = 'Error: ' + e.message;
    });
    listenRoom();
}

window.joinRoom = () => {
    roomId = document.getElementById('joinInput').value.toUpperCase();
    playerId = 'p2';
    document.getElementById('roomCode').innerText = 'Room Code: ' + roomId;
    update(ref(db, 'rooms/' + roomId + '/players'), { p2: { x:700, y:300, color:'orange', alive:true } });
    document.getElementById('status').innerText = 'Joined! Game Started!';
    listenRoom();
}

window.restartGame = () => {
    if(!roomId) return;
    set(ref(db, 'rooms/' + roomId + '/players'), { 
        p1: { x:100, y:300, color:'cyan', alive:true },
        p2: { x:700, y:300, color:'orange', alive:true }
    });
    set(ref(db, 'rooms/' + roomId + '/lines'), {});
}

function listenRoom() {
    onValue(ref(db, 'rooms/' + roomId), (snapshot) => {
        gameState = snapshot.val() || {players:{}, lines:{}};
        if(gameState.players && Object.keys(gameState.players).length >= 2) {
            document.getElementById('status').innerText = 'Game Started! Hold DRAW + Move';
        }
        draw();
    });
}

function updatePlayer() {
    if(!roomId ||!playerId ||!gameState.players[playerId]) return;
    let p = gameState.players[playerId];
    if(!p.alive) return;

    if(keys['w']) p.y -= 4;
    if(keys['s']) p.y += 4;
    if(keys['a']) p.x -= 4;
    if(keys['d']) p.x += 4;
    p.x = Math.max(10, Math.min(790, p.x));
    p.y = Math.max(10, Math.min(590, p.y));

    if(keys[' '] && lastPos[playerId]) {
        push(ref(db, 'rooms/' + roomId + '/lines'), {x1:lastPos[playerId].x, y1:lastPos[playerId].y, x2:p.x, y2:p.y, color:p.color});
    }
    lastPos[playerId] = keys[' ']? {x:p.x, y:p.y} : null;

    update(ref(db, 'rooms/' + roomId + '/players/' + playerId), {x:p.x, y:p.y});
}

function draw() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0,0,800,600);
    ctx.lineWidth = 4;
    for(let id in gameState.lines) {
        let pt = gameState.lines[id];
        ctx.strokeStyle = pt.color; 
        ctx.beginPath();
        ctx.moveTo(pt.x1, pt.y1);
        ctx.lineTo(pt.x2, pt.y2);
        ctx.stroke();
    }
    for(let id in gameState.players){
        let p = gameState.players[id];
        if(p.alive){
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 10, 0, Math.PI*2);
            ctx.fill();
        }
    }
}
setInterval(updatePlayer, 1000/60);
</script>
</body>
</html>
