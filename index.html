<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lineman Game</title>
<style>
body{margin:0;background:#87CEEB;overflow:hidden}
#score{position:absolute;top:10px;left:10px;color:white;font-size:24px;font-weight:bold;text-shadow:2px 2px #000}
#mpesa{position:absolute;top:10px;right:10px;color:white;background:#00A651;padding:8px;border-radius:5px;font-weight:bold}
canvas{display:block}
.btn{position:absolute;bottom:30px;width:70px;height:70px;font-size:40px;border-radius:50%;border:3px solid white;background:rgba(0,0,0,0.4);color:white}
#up{left:calc(50% - 90px)}
#down{left:calc(50% + 20px)}
</style>
</head>
<body>
<div id="score">SCORE: 0</div>
<div id="mpesa">M-PESA: 0707649890</div>
<canvas id="c"></canvas>
<button id="up" class="btn">↑</button>
<button id="down" class="btn">↓</button>

<script>
let c=document.getElementById('c'),x=c.getContext('2d');
c.width=innerWidth;c.height=innerHeight-100;
  // SOUNDS
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playSound(type){
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    if(type === 'up'){
        osc.frequency.value = 600; // high beep
        gain.gain.value = 0.1;
    }
    if(type === 'crash'){
        osc.frequency.value = 100; // low buzz
        gain.gain.value = 0.3;
    }
    if(type === 'score'){
        osc.frequency.value = 800; // tick
        gain.gain.value = 0.05;
    }
    
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.2);
    osc.stop(audioCtx.currentTime + 0.2);
}

// Browsers need a click to start sound
document.body.addEventListener('touchstart', () => audioCtx.resume());
let py=c.height/2,px=120
let poles=[300,700,1100,1500,1900].map(v=>({x:v,y:c.height-100}));
let birds=[500,1000,1500].map((v,i)=>({x:v,y:200+i*50}));

document.getElementById('up').ontouchstart=()=>up=1;
document.getElementById('up').ontouchend=()=>up=0;
document.getElementById('down').ontouchstart=()=>down=1;
document.getElementById('down').ontouchend=()=>down=0;

  let speed = 3 + Math.floor(s/1000); // +1 speed every 1000 points
function loop(){
x.clearRect(0,0,c.width,c.height);
if(up){py-=5; s = s + 0.1} // slower counting
if(down){py+=5}
document.getElementById('score').innerText='SCORE: '+Math.floor(s);

// draw wires
x.strokeStyle='#000';x.lineWidth=3;
poles.forEach(p=>{x.beginPath();x.moveTo(px,py-20);x.lineTo(p.x,p.y-100);x.stroke()});

// draw poles
x.fillStyle='#8B4513';
poles.forEach(p=>{p.x-=3;if(p.x<-50)p.x=c.width+50;x.fillRect(p.x-10,p.y,20,200);x.fillRect(p.x-40,p.y-100,80,10)});

// draw birds
x.fillStyle='#000';
birds.forEach(b=>{b.x-=4;if(b.x<-50){b.x=c.width+50;b.y=Math.random()*300+100} x.beginPath();x.moveTo(b.x,b.y);x.lineTo(b.x+20,b.y-10);x.lineTo(b.x+20,b.y+10);x.fill()});

// draw player

// draw LINEMAN - BIGGER AND WITH OUTLINE
x.fillStyle='#000'; // black outline
x.fillRect(px-18,py-28,36,56); // outline body
x.fillStyle='#FFD700'; // yellow body
x.fillRect(px-15,py-25,30,50); // body
x.fillStyle='#000'; // outline head
x.beginPath();x.arc(px,py-35,18,0,6.28);x.fill();
x.fillStyle='#FFD700'; // yellow head
x.beginPath();x.arc(px,py-35,15,0,6.28);x.fill();
x.fillStyle='#FFF'; // white helmet
x.beginPath();x.arc(px,py-35,17,0,6.28);x.fill();
x.fillStyle='#FF0000'; // red stripe on helmet
x.fillRect(px-17,py-40,34,4);
document.getElementById('score').innerText='SCORE: '+s;
requestAnimationFrame(loop);
}
loop();
</script>
  <div id="over" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.85);color:white;padding:30px;border-radius:15px;display:none;text-align:center;z-index:999">
    <h2>⚡ GAME OVER ⚡</h2>
    <p id="finalScore" style="font-size:24px">Score: 0</p>
    <button onclick="location.reload()" style="padding:12px 25px;font-size:18px;border:0;border-radius:8px;background:red;color:white;font-weight:bold">PLAY AGAIN</button>
  </div>
</body>
</html>
