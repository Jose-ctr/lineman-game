<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>KPLC Lineman Training</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style> 
        body { margin: 0; background: linear-gradient(to bottom, #87CEEB 0%, #FFE4B5 100%); overflow: hidden; font-family: Arial; }
        .btn { position: absolute; bottom: 100px; width: 90px; height: 90px; background: rgba(0,51,102,0.8); border-radius: 50%; color: white; font-size: 45px; text-align: center; line-height: 90px; user-select: none; border: 3px solid #FFD700; }
        #btnUp { left: 25%; } #btnDown { right: 25%; }
        #ui { position: absolute; top: 10px; width: 100%; text-align: center; color: #003366; font-size: 18px; font-weight: bold; background: rgba(255,255,255,0.8); padding: 10px; }
        #gameOver { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(0,51,102,0.95); color: white; padding: 25px; border-radius: 20px; text-align: center; display: none; width: 85%; border: 3px solid #FFD700; }
        #donateBtn { position: absolute; bottom: 10px; width: 100%; text-align: center; }
        #donateBtn button { background: #00A651; color: white; border: none; padding: 12px 25px; font-size: 16px; border-radius: 25px; font-weight: bold; }
        .kplc-title { color: #FFD700; font-size: 14px; }
        #startScreen { position: absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); color:white; display:flex; align-items:center; justify-content:center; font-size:24px; z-index:999; }
    </style>
</head>
<body>
<div id="startScreen" onclick="startGame()">TAP TO START<br><small>KPLC Safety First</small></div>

<div id="ui">
    <div class="kplc-title">KPLC LINEMAN TRAINING</div>
    Level: 1 | Score: 0 | Height: 0m
</div>
<div id="btnUp" class="btn">↑</div>
<div id="btnDown" class="btn">↓</div>

<div id="gameOver">
    <h2>SAFETY FIRST!</h2>
    <p id="finalScore">Score: 0</p>
    <button onclick="location.reload()" style="padding:10px 20px; font-size:18px; background:#FFD700; color:#003366; border:none; border-radius:10px;">Play Again</button>
</div>

<div id="donateBtn">
    <button onclick="alert('Support KPLC Lineman Game\nM-Pesa: 0707 649 890\nAsante Sana! 🙏')">Support 50/-</button>
</div>

<script>
let gameStarted = false;
const config = {
    type: Phaser.AUTO,
    width: window.innerWidth,
    height: window.innerHeight,
    backgroundColor: '#87CEEB',
    physics: { default: 'arcade' },
    scene: { create, update }
};

let player, poles = [], birds = [], height = 0, score = 0, level = 1, upPressed = false, downPressed = false;
let climbSound, gameOverSound;
const game = new Phaser.Game(config);

function startGame(){
    document.getElementById('startScreen').style.display = 'none';
    gameStarted = true;
}

function create() {
    // CREATE IMAGES WITH CODE - NO FILES NEEDED
    // Pole: Brown rectangle
    for(let i = 0; i < 5; i++){
        let pole = this.add.rectangle(150 + i * 200, window.innerHeight - 120, 30, 300, 0x8B4513);
        let wires = this.add.rectangle(150 + i * 200, window.innerHeight - 270, 100, 5, 0x000);
        poles.push(pole);
    }
    
    // Lineman: Blue rectangle with helmet
    player = this.add.rectangle(window.innerWidth / 2, window.innerHeight - 100, 30, 50, 0x003366);
    let helmet = this.add.circle(window.innerWidth / 2, window.innerHeight - 130, 12, 0xFFD700);
    this.physics.add.existing(player);

    // Birds: Black triangles
    for(let i = 0; i < 4; i++){
        let bird = this.add.triangle(200 + i * 220, 180 + i * 80, 0, 20, 20, 0, 10, 20, 0x000);
        this.physics.add.existing(bird);
        bird.body.velocity.x = -130 - level * 25;
        birds.push(bird);
    }

    // SOUNDS
    climbSound = this.sound.add('https://cdn.pixabay.com/audio/1/1/climbing-1.mp3');
    gameOverSound = this.sound.add('https://cdn.pixabay.com/audio/1/1/game-over-1.mp3');

    // Touch controls
    document.getElementById('btnUp').ontouchstart = () => { upPressed = true; if(gameStarted) climbSound.play(); }
    document.getElementById('btnUp').ontouchend = () => { upPressed = false; climbSound.stop(); }
    document.getElementById('btnDown').ontouchstart = () => downPressed = true;
    document.getElementById('btnDown').ontouchend = () => downPressed = false;
}

function update() {
    if(!gameStarted) return;
    
    let speed = 2.5 + level * 0.6;
    
    if (upPressed && player.y > 120) {
        player.y -= speed;
        height += 0.3;
        score += 2;
    }
    if (downPressed && player.y < window.innerHeight - 100) player.y += speed;

    birds.forEach(bird => {
        bird.x += bird.body.velocity.x * 0.016;
        if(bird.x < -50) bird.x = window.innerWidth + 50;
        if(Phaser.Geom.Intersects.RectangleToRectangle(player.getBounds(), bird.getBounds())){
            gameOver(this);
        }
    });

    if(score > level * 400){ level++; }
    if(height < 0){ gameOver(this); }

    document.getElementById('ui').innerHTML = `<div class="kplc-title">KPLC LINEMAN TRAINING</div>Level: ${level} | Score: ${score} | Height: ${Math.floor(height)}m`;
}

function gameOver(scene){
    gameOverSound.play();
    document.getElementById('gameOver').style.display = 'block';
    document.getElementById('finalScore').innerText = `Final Score: ${score} | Level Reached: ${level}`;
    scene.scene.pause();
}
</script>
</body>
</html>
