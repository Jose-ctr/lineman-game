<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<style>
body{margin:0;font-family:Arial;background:#87CEEB;display:flex;flex-direction:column;height:100vh;overflow:hidden}
#gameArea{flex:1;position:relative}
#score{position:absolute;top:10px;left:10px;font-size:18px;font-weight:bold;color:#fff;text-shadow:2px 2px 0 #000;z-index:10}
#mpesa{position:absolute;top:10px;right:10px;background:#00A651;color:#fff;padding:6px 10px;border-radius:8px;font-weight:bold;font-size:12px;z-index:10}
button.gameBtn{position:absolute;bottom:10px;width:70px;height:70px;border-radius:50%;font-size:30px;border:3px solid #fff;background:#2F4F4F;color:#fff;z-index:10}
#up{left:15%}
#down{left:40%}
#jump{right:15%;background:#FF8C00;width:80px;height:80px}
#restart{position:absolute;top:52%;left:50%;transform:translate(-50%,-50%);width:180px;height:50px;border-radius:20px;font-size:20px;background:#FF0000;display:none;z-index:10}
#gameover{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);font-size:36px;color:#FF0000;font-weight:bold;text-shadow:2px 2px 0 #fff;display:none;z-index:10}
#chatArea{height:35%;background:#fff;border-top:3px solid #075E54;display:flex;flex-direction:column}
.header{background:#075E54;color:#fff;padding:8px 12px;font-size:16px;font-weight:bold;display:flex;gap:8px;align-items:center}
.chat{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:6px}
.msg{max-width:75%;padding:6px 10px;border-radius:14px;font-size:14px}
.user{align-self:flex-end;background:#DCF8C6}
.bot{align-self:flex-start;background:#f1f0f0}
.input-area{display:flex;padding:6px;background:#eee;gap:6px}
input{flex:1;border:none;padding:8px 12px;border-radius:20px;outline:none;font-size:14px}
.input-area button{background:#075E54;color:#fff;border:none;padding:8px 14px;border-radius:50%;cursor:pointer}
</style>
</head>
<body>
<!-- GAME -->
<div id="gameArea">
  <div id="score">SCORE: 0</div>
  <div id="mpesa">M-PESA: 0707649890</div>
  <div id="gameover">GAME OVER</div>
  <button id="restart">RESTART</button>
  <button id="up" class="gameBtn">↑</button>
  <button id="down" class="gameBtn">↓</button>
  <button id="jump" class="gameBtn">JUMP</button>
  <canvas id="c"></canvas>
</div>

<!-- CHAT BOT -->
<div id="chatArea">
  <div class="header">🤖 Lineman Bot</div>
  <div class="chat" id="chat">
    <div class="msg bot">Yo! Welcome to Lineman Game 🔥 Tap JUMP to start. Need tips?</div>
  </div>
  <div class="input-area">
    <input id="input" placeholder="Ask me anything..." onkeypress="if(event.key==='Enter')send()">
    <button onclick="send()">➤</button>
  </div>
</div>

<!-- SOUNDS -->
<audio id="jumpSound" src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAESsAAABAAZGF0YQAAAAA="></audio>
<audio id="crashSound" src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAESsAAABABAAZGF0YQAAAAA="></audio>

<script>
/* ===== GAME CODE ===== */
let c=document.getElementById('c'),x=c.getContext('2d');
c.width=innerWidth; c.height=document.getElementById('gameArea').offsetHeight;
let px=100,py=c.height/2,vy=0,s=0,up=0,down=0,gameOver=false,deathReported=false;
let gap=200; let poleDistance=350;
let poles=[{x:400,gapY:200},{x:400+poleDistance,gapY:350},{x:400+poleDistance*2,gapY:250}];
let birds=[{x:575,y:150},{x:575+poleDistance,y:500}];
let jumpSound = document.getElementById('jumpSound');
let crashSound = document.getElementById('crashSound');

document.getElementById('up').ontouchstart=()=>up=1;
document.getElementById('up').ontouchend=()=>up=0;
document.getElementById('down').ontouchstart=()=>down=1;
document.getElementById('down').ontouchend=()=>down=0;
document.getElementById('jump').ontouchstart=()=>{vy=-12; jumpSound.play().catch(()=>{})};
document.getElementById('restart').onclick=reset;

function botSay(text){ addMsg(text,'bot'); }

function reset(){
  s=0; py=c.height/2; vy=0; gameOver=false; deathReported=false;
  poles=[{x:400,gapY:200},{x:400+poleDistance,gapY:350},{x:400+poleDistance*2,gapY:250}];
  birds=[{x:575,y:150},{x:575+poleDistance,y:500}];
  document.getElementById('gameover').style.display='none';
  document.getElementById('restart').style.display='none';
  botSay("New game! You got this 💪");
  loop();
}

function gameOverFunc(){
  if(deathReported) return; // FIX 1: prevent spam
  deathReported=true;
  gameOver=true;
  crashSound.play().catch(()=>{}); // FIX 3: crash sound
  document.getElementById('gameover').style.display='block';
  document.getElementById('restart').style.display='block';
  botSay("OOF! You crashed at "+Math.floor(s)+" points 😂 Want tips to beat it?");
}

function loop(){
  if(gameOver) return;
  
  let speed = Math.min(7, 2 + Math.floor(s/1500));
  x.clearRect(0,0,c.width,c.height);
  
  if(up){vy-=0.3}
  if(down){vy+=0.3}
  vy+=0.4; py+=vy; s=s+0.1;
  if(py<0){py=0;vy=0} 
  if(py>c.height-60){py=c.height-60;vy=0}
  
  document.getElementById('score').innerText='SCORE: '+Math.floor(s)+' SPEED: '+speed;

  x.fillStyle='#8B4513';
  poles.forEach(p=>{
    p.x-=speed;
    if(p.x<-50){p.x=poles[(poles.indexOf(p)-1+3)%3].x + poleDistance;p.gapY=Math.random()*(c.height-gap-120)+60;}
    x.fillRect(p.x,0,10,p.gapY);
    x.fillRect(p.x,p.gapY+gap,10,c.height);
    if(px+20 > p.x && px < p.x+10){ if(py < p.gapY || py+30 > p.gapY+gap) gameOverFunc(); }
  });

  x.fillStyle='#000';
  birds.forEach(b=>{
    b.x-=(speed+1);
    if(b.x<-50){b.x=poles[2].x+100;b.y=Math.random()*(c.height-200)+100}
    x.beginPath();x.arc(b.x,b.y,8,0,Math.PI*2);x.fill();
    let dx=px+10-b.x, dy=py+15-b.y;
    if(Math.sqrt(dx*dx+dy*dy) < 18) gameOverFunc();
  });

  x.fillStyle='#000'; x.fillRect(px-2,py-2,24,34);
  x.fillStyle='#FFD700'; x.fillRect(px,py,20,30);
  x.beginPath();x.arc(px+10,py-5,8,0,Math.PI*2);x.fill();
  
  if(!gameOver) requestAnimationFrame(loop);
}
loop();

/* ===== CHAT BOT CODE ===== */
function send(){
  let txt=document.getElementById('input').value;
  if(txt==='')return;
  addMsg(txt,'user');
  document.getElementById('input').value='';
  
  setTimeout(()=>{
    let reply = getBotReply(txt.toLowerCase());
    addMsg(reply,'bot');
  },600);
}

function addMsg(text,who){
  let d=document.createElement('div');
  d.className='msg '+who; d.innerText=text;
  document.getElementById('chat').appendChild(d);
  document.getElementById('chat').scrollTop=99999;
}

function getBotReply(msg){
  if(msg.includes('tip') || msg.includes('help')) 
    return "Pro tip: Tap JUMP lightly! Don't spam it. And aim for the middle of the gap.";
  if(msg.includes('score') || msg.includes('high')) 
    return "Current score: "+Math.floor(s)+". Beat 11651 and I'll be impressed 🔥";
  if(msg.includes('speed')) 
    return "Speed goes up every 1500 points. Max is 7. That's when it gets crazy!";
  if(msg.includes('mpesa')) 
    return "That's my payment number 😂 0707649890. Send me bundles pls";
  return "I watch you play! Ask me 'tip', 'score', or 'speed'";
}
</script>
</body>
</html>
