<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lineman ONLINE</title>
<style>
body{background:#000;color:#0f0;text-align:center;margin:0;padding:10px;font-family:Arial}
h1{margin:5px}
input{padding:10px;font-size:16px;width:120px;text-align:center}
button{padding:10px 15px;margin:3px;font-size:16px;border:none;border-radius:6px;font-weight:bold}
#create{background:#00aaff;color:#fff}
#join{background:#00ddaa;color:#000}
canvas{background:#000;border:2px solid #0f0;display:block;margin:10px auto}
#draw{background:orange;color:#000;width:160px;height:60px;font-size:20px}
.controls button{width:60px;height:60px;background:#222;color:#fff;font-size:24px}
</style>
</head>
<body>
<h1>LINEMAN ONLINE</h1>
<button id="create">Create Room</button>
<input id="roomInput" placeholder="Room Code">
<button id="join">Join Room</button>
<div>Room Code: <span id="roomCode">-</span></div>
<canvas id="c" width="340" height="280"></canvas>

<div class="controls">
<button id="up">↑</button><br>
<button id="left">←</button>
<button id="down">↓</button>
<button id="right">→</button>
</div>
<button id="draw">DRAW</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

// TUMIA HII FIREBASE YA BURE
const firebaseConfig = {
  apiKey: "AIzaSyA1b2c3d4e5f6g7h8i9j0",
  authDomain: "lineman-demo.firebaseapp.com",
  databaseURL: "https://lineman-demo-default-rtdb.firebaseio.com",
  projectId: "lineman-demo",
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const c=document.getElementById('c'),ctx=c.getContext('2d');
let roomId=null,player=null;
let game={p1:{x:90,y:140,col:'cyan',alive:true,line:[],d:false},p2:{x:250,y:140,col:'orange',alive:true,line:[],d:false}};
let keys={};

document.getElementById('create').onclick=()=>{
  roomId=Math.random().toString(36).substr(2,4).toUpperCase();
  player='p1';
  set(ref(db,'rooms/'+roomId),game);
  document.getElementById('roomCode').innerText=roomId;
  alert('Room Created! Code: '+roomId+'\nMpe rafiki yako aingie');
  listen();
};

document.getElementById('join').onclick=()=>{
  roomId=document.getElementById('roomInput').value.toUpperCase();
  player='p2';
  document.getElementById('roomCode').innerText=roomId;
  listen();
};

function listen(){
  onValue(ref(db,'rooms/'+roomId),(snap)=>{
    if(snap.exists()){game=snap.val();draw();}
  });
}

function draw(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,340,280);
  ['p1','p2'].forEach(p=>{
    if(!game[p].alive)return;
    ctx.fillStyle=game[p].col;ctx.beginPath();ctx.arc(game[p].x,game[p].y,7,0,6.28);ctx.fill();
    ctx.strokeStyle=game[p].col;ctx.lineWidth=3;
    game[p].line.forEach(seg=>{ctx.beginPath();ctx.moveTo(seg[0].x,seg[0].y);seg.forEach(pt=>ctx.lineTo(pt.x,pt.y));ctx.stroke();})
  });
}

function move(dx,dy){
  if(!player)return;
  game[player].x+=dx;game[player].y+=dy;
  if(game[player].d){if(game[player].line.length==0)game[player].line.push([{x:game[player].x,y:game[player].y}]);game[player].line[game[player].line.length-1].push({x:game[player].x,y:game[player].y});}
  set(ref(db,'rooms/'+roomId),game);
}

setInterval(()=>{
  if(keys['w'])move(0,-2.5);if(keys['s'])move(0,2.5);if(keys['a'])move(-2.5,0);if(keys['d'])move(2.5,0);
  if(keys['ArrowUp'])move(0,-2.5);if(keys['ArrowDown'])move(0,2.5);if(keys['ArrowLeft'])move(-2.5,0);if(keys['ArrowRight'])move(2.5,0);
},40);

window.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key==' ')game[player].d=true;});
window.addEventListener('keyup',e=>{keys[e.key]=false;if(e.key==' ')game[player].d=false;});
document.getElementById('draw').ontouchstart=()=>{if(player)game[player].d=true};
document.getElementById('draw').ontouchend=()=>{if(player)game[player].d=false};
['up','down','left','right'].forEach(id=>{
document.getElementById(id).ontouchstart=()=>keys[id]=true;
document.getElementById(id).ontouchend=()=>keys[id]=false;
});
</script>
</body>
</html>
