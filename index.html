<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Lineman Game ⚡</title>
<style>
body{margin:0;background:#87CEEB;overflow:hidden;font-family:Arial}
#score{position:absolute;top:10px;left:10px;color:white;font-size:24px;font-weight:bold;text-shadow:2px 2px 4px #000}
#donate{position:absolute;top:10px;right:10px;background:red;color:white;border:0;padding:10px;border-radius:8px;font-weight:bold}
canvas{display:block}
.controls{position:absolute;bottom:30px;width:100%;display:flex;justify-content:center;gap:30px}
.controls button{width:70px;height:70px;font-size:30px;border-radius:50%;border:3px solid white;background:rgba(0,0,0,0.3);color:white}
#over{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.9);color:white;padding:30px;border-radius:15px;display:none;text-align:center}
</style>
</head>
<body>
<div id="score">SCORE: 0</div>
<button id="donate" onclick="navigator.clipboard.writeText('0707649890');alert('M-PESA: 0707649890 copied! ASANTE!')">⚡ SUPPORT DEVELOPER</button>
<canvas id="game"></canvas>
<div class="controls">
<button id="up">↑</button>
<button id="down">↓</button>
</div>
<div id="over"><h2>⚡ GAME OVER ⚡</h2><p id="final"></p><button onclick="location.reload()">RESTART</button></div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight - 100;

let playerY = 300, playerX = 100, score = 0, gameOver = false;
let up = false, down = false;
let poles = [], birds = [];

// CREATE POLES
for(let i=0;i<5;i++) poles.push({x:300+i*400,y:canvas.height-100});
// CREATE BIRDS
for(let i=0;i<3;i++) birds.push({x:500+i*500,y:200+i*50});

// BUTTONS
document.getElementById('up').ontouchstart = () => up=true;
document.getElementById('up').ontouchend = () => up=false;
document.getElementById('down').ontouchstart = () => down=true;
document.getElementById('down').ontouchend = () => down=false;

function drawPole(x,y){
    ctx.fillStyle = '#8B4513'; // brown
    ctx.fillRect(x-10,y,20,200); // pole
    ctx.fillRect(x-40,y-100,80,10); // crossarm
}

function drawBird(x,y){
    ctx.fillStyle = '#000';
    ctx.beginPath(); // triangle bird
    ctx.moveTo(x,y);
    ctx.lineTo(x+20,y+10);
    ctx.lineTo(x+20,y-10);
    ctx.closePath();
    ctx.fill();
}

function drawPlayer(x,y){
    ctx.fillStyle = '#FFD700'; // yellow lineman
    ctx.fillRect(x-10,y-20,20,40); // body
    ctx.fillStyle = '#FFF'; // helmet
    ctx.beginPath();
    ctx.arc(x,y-30,12,0,Math.PI*2);
    ctx.fill();
}

function gameLoop(){
    if(gameOver) return;
    ctx.clearRect(0,0,canvas.width,canvas.height);

    // MOVE PLAYER
    if(up){playerY-=4;score++}
    if(down){playerY+=4}
    
    // DRAW WIRES
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    poles.forEach(p => {
        ctx.beginPath();
        ctx.moveTo(playerX,y=playerY-20);
        ctx.lineTo(p.x,p.y-100);
        ctx.stroke();
    });

    // DRAW POLES
    poles.forEach(p => {
        p.x -= 3;
        if(p.x < -50) p.x = canvas.width + 50;
        drawPole(p.x,p.y);
    });

    // DRAW BIRDS

        if(b.x < -50){b.x = canvas.width +
