<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lineman Game</title>
<style>
body{margin:0;background:#87CEEB;overflow:hidden}
#score{position:absolute;top:10px;left:10px;color:white;font-size:24px;font-weight:bold;text-shadow:2px 2px #000}
#mpesa{position:absolute;top:10px;right:10px;color:white;background:#00A651;padding:8px;border-radius:5px;font-weight:bold}
canvas{display:block}
.btn{position:absolute;bottom:30px;width:70px;height:70px;font-size:40px;border-radius:50%;border:3px solid white;background:rgba(0,0,0,0.4);color:white}
#up{left:calc(50% - 90px)}
#down{left:calc(50% + 20px)}
</style>
</head>
<body>
<div id="score">SCORE: 0</div>
<div id="mpesa">M-PESA: 0707649890</div>
<canvas id="c"></canvas>
<button id="up" class="btn">↑</button>
<button id="down" class="btn">↓</button>

<script>
let c=document.getElementById('c'),x=c.getContext('2d');
c.width=innerWidth;c.height=innerHeight-100;
let py=300,px=100,s=0,up=0,down=0;
let poles=[300,700,1100,1500,1900].map(v=>({x:v,y:c.height-100}));
let birds=[500,1000,1500].map((v,i)=>({x:v,y:200+i*50}));

document.getElementById('up').ontouchstart=()=>up=1;
document.getElementById('up').ontouchend=()=>up=0;
document.getElementById('down').ontouchstart=()=>down=1;
document.getElementById('down').ontouchend=()=>down=0;

function loop(){
x.clearRect(0,0,c.width,c.height);
if(up){py-=5;s++} if(down){py+=5}

// draw wires
x.strokeStyle='#000';x.lineWidth=3;
poles.forEach(p=>{x.beginPath();x.moveTo(px,py-20);x.lineTo(p.x,p.y-100);x.stroke()});

// draw poles
x.fillStyle='#8B4513';
poles.forEach(p=>{p.x-=3;if(p.x<-50)p.x=c.width+50;x.fillRect(p.x-10,p.y,20,200);x.fillRect(p.x-40,p.y-100,80,10)});

// draw birds
x.fillStyle='#000';
birds.forEach(b=>{b.x-=4;if(b.x<-50){b.x=c.width+50;b.y=Math.random()*300+100} x.beginPath();x.moveTo(b.x,b.y);x.lineTo(b.x+20,b.y-10);x.lineTo(b.x+20,b.y+10);x.fill()});

// draw player
x.fillStyle='#FFD700';x.fillRect(px-10,py-20,20,40);x.fillStyle='#FFF';x.beginPath();x.arc(px,py-30,12,0,6.28);x.fill();

document.getElementById('score').innerText='SCORE: '+s;
requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
