<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Lineman Training Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style> 
        body { margin: 0; background: linear-gradient(to bottom, #87CEEB 0%, #FFE4B5 100%); overflow: hidden; font-family: Arial; }
        .btn { position: absolute; bottom: 100px; width: 90px; height: 90px; background: rgba(255,69,0,0.8); border-radius: 50%; color: white; font-size: 45px; text-align: center; line-height: 90px; user-select: none; border: 3px solid #fff; }
        #btnUp { left: 25%; } #btnDown { right: 25%; }
        #ui { position: absolute; top: 10px; width: 100%; text-align: center; color: #FF4500; font-size: 18px; font-weight: bold; background: rgba(255,255,255,0.9); padding: 10px; }
        #gameOver { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(255,69,0,0.95); color: white; padding: 25px; border-radius: 20px; text-align: center; display: none; width: 85%; }
    </style>
</head>
<body>
<div id="ui">
    <div>LINEMAN TRAINING PRO v2</div>
    Level: 1 | Score: 0 | Height: 0m
</div>
<div id="btnUp" class="btn">↑</div>
<div id="btnDown" class="btn">↓</div>

<div id="gameOver">
    <h2>GAME OVER!</h2>
    <p id="finalScore">Score: 0</p>
    <button onclick="location.reload()" style="padding:10px 20px; font-size:18px;">Play Again</button>
</div>

<script>
const config = {
    type: Phaser.AUTO,
    width: window.innerWidth,
    height: window.innerHeight,
    backgroundColor: '#87CEEB',
    physics: { default: 'arcade' },
    scene: { create, update }
};

let player, poles = [], birds = [], height = 0, score = 0, level = 1, upPressed = false, downPressed = false;
const game = new Phaser.Game(config);

function create() {
    // POLES - Brown rectangles
    for(let i = 0; i < 5; i++){
        let pole = this.add.rectangle(150 + i * 200, window.innerHeight - 120, 30, 300, 0x8B4513);
        this.add.rectangle(150 + i * 200, window.innerHeight - 270, 100, 5, 0x000);
    }
    
    // LINEMAN - Red rectangle + Yellow circle helmet
    player = this.add.rectangle(window.innerWidth / 2, window.innerHeight - 100, 30, 50, 0xFF0000);
    this.add.circle(window.innerWidth / 2, window.innerHeight - 130, 12, 0xFFD700);
    this.physics.add.existing(player);

    // BIRDS
    for(let i = 0; i < 4; i++){
        let bird = this.add.triangle(200 + i * 220, 180 + i * 80, 0, 20, 20, 0, 10, 20, 0x000);
        this.physics.add.existing(bird);
        bird.body.velocity.x = -150;
        birds.push(bird);
    }

    document.getElementById('btnUp').ontouchstart = () => upPressed = true;
    document.getElementById('btnUp').ontouchend = () => upPressed = false;
    document.getElementById('btnDown').ontouchstart = () => downPressed = true;
    document.getElementById('btnDown').ontouchend = () => downPressed = false;
}

function update() {
    let speed = 3;
    
    if (upPressed && player.y > 120) {
        player.y -= speed;
        height += 0.3;
        score += 2;
    }
    if (downPressed && player.y < window.innerHeight - 100) player.y += speed;
