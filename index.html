<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lineman Mobile</title>
<style>
body{background:#000;color:#fff;text-align:center;margin:0;padding:10px;font-family:Arial}
h1{color:#0f0;font-size:20px;margin:5px}
canvas{background:#111;border:2px solid #0f0;display:block;margin:5px auto; width:95%; height:300px}
button{padding:12px 18px;margin:3px;font-size:16px;border:none;border-radius:8px;font-weight:bold}
#draw{background:orange;color:#000;width:160px;height:60px;font-size:22px}
.controls button{width:60px;height:60px;background:#333;color:#fff;font-size:24px}
#status{color:#0f0;margin:5px}
</style>
</head>
<body>
<h1>LINEMAN</h1>
<div id="status">Room: LOCAL - 2 Players</div>
<canvas id="c"></canvas>

<div class="controls">
<button id="up">↑</button><br>
<button id="left">←</button>
<button id="down">↓</button>
<button id="right">→</button>
</div>
<button id="draw">DRAW</button>
<button id="reset">RESET</button>

<script>
const c=document.getElementById('c');
c.width=350; c.height=300; // ndogo kwa simu
const ctx=c.getContext('2d');
let p1={x:80,y:150,col:'cyan',alive:true,line:[],drawing:false};
let p2={x:270,y:150,col:'orange',alive:true,line:[],drawing:false};
let keys={};

function draw(){
ctx.fillStyle='#111';ctx.fillRect(0,0,350,300);
[p1,p2].forEach(p=>{
if(!p.alive)return;
ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,6,0,6.28);ctx.fill();
ctx.strokeStyle=p.col;ctx.lineWidth=2;
p.line.forEach(seg=>{ctx.beginPath();ctx.moveTo(seg[0].x,seg[0].y);seg.forEach(pt=>ctx.lineTo(pt.x,pt.y));ctx.stroke();})
});
}
function move(p,dx,dy){
if(!p.alive)return;
p.x+=dx;p.y+=dy;
if(p.x<0)p.x=0;if(p.x>350)p.x=350;if(p.y<0)p.y=0;if(p.y>300)p.y=300;
if(p.drawing){if(p.line.length==0)p.line.push([{x:p.x,y:p.y}]);p.line[p.line.length-1].push({x:p.x,y:p.y});}
}
function check(){
[p1,p2].forEach(me=>[p1,p2].forEach(other=>{if(me!=other)other.line.flat().forEach(pt=>{if(Math.abs(me.x-pt.x)<5&&Math.abs(me.y-pt.y)<5)me.alive=false;}))})}
setInterval(()=>{
if(keys['w'])move(p1,0,-2);if(keys['s'])move(p1,0,2);if(keys['a'])move(p1,-2,0);if(keys['d'])move(p1,2,0);
if(keys['ArrowUp'])move(p2,0,-2);if(keys['ArrowDown'])move(p2,0,2);if(keys['ArrowLeft'])move(p2,-2,0);if(keys['ArrowRight'])move(p2,2,0);
check();draw();
},40);

document.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key==' ')p1.drawing=true;});
document.addEventListener('keyup',e=>{keys[e.key]=false;if(e.key==' ')p1.drawing=false;});

document.getElementById('draw').ontouchstart=()=>p1.drawing=true;
document.getElementById('draw').ontouchend=()=>p1.drawing=false;
['up','down','left','right'].forEach(id=>{
document.getElementById(id).ontouchstart=()=>keys[id]=true;
document.getElementById(id).ontouchend=()=>keys[id]=false;
});
document.getElementById('reset').onclick=()=>location.reload();
</script>
</body>
</html>
