<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Lineman Training Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style> 
        body { margin: 0; background: #87CEEB; overflow: hidden; font-family: Arial; }
        .btn { position: absolute; bottom: 100px; width: 90px; height: 90px; background: rgba(255,69,0,0.8); border-radius: 50%; color: white; font-size: 45px; text-align: center; line-height: 90px; user-select: none; border: 3px solid #fff; }
        #btnUp { left: 25%; } #btnDown { right: 25%; }
        #ui { position: absolute; top: 10px; width: 100%; text-align: center; color: #FF4500; font-size: 18px; font-weight: bold; background: rgba(255,255,255,0.9); padding: 10px; }
        #gameOver { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(0,0,0,0.9); color: white; padding: 25px; border-radius: 20px; text-align: center; display: none; width: 85%; }
        #donateBtn { position: absolute; bottom: 10px; width: 100%; text-align: center; }
        #donateBtn button { background: #00A651; color: white; border: none; padding: 12px 25px; font-size: 16px; border-radius: 25px; font-weight: bold; }
    </style>
</head>
<body>
<div id="ui">
    <div>LINEMAN TRAINING PRO</div>
    Level: 1 | Score: 0 | Height: 0m
</div>
<div id="btnUp" class="btn">↑</div>
<div id="btnDown" class="btn">↓</div>

<div id="gameOver">
    <h2>GAME OVER!</h2>
    <p id="finalScore">Score: 0</p>
    <button onclick="location.reload()" style="padding:10px 20px; font-size:18px; background:#FF4500; color:white; border:none; border-radius:10px;">Play Again</button>
</div>

<div id="donateBtn">
    <button onclick="alert('Support the Game\nM-Pesa: 0707 649 890\nThank You! 🙏')">Support 50/-</button>
</div>

<script>
const config = {
    type: Phaser.AUTO,
    width: window.innerWidth,
    height: window.innerHeight,
    backgroundColor: '#87CEEB',
    physics: { default: 'arcade' },
    scene: { create, update }
};

let player, poles = [], birds = [], height = 0, score = 0, level = 1, upPressed = false, downPressed = false;
const game = new Phaser.Game(config);

function create() {
    // SKY BACKGROUND
    this.add.rectangle(window.innerWidth/2, window.innerHeight/2, window.innerWidth, window.innerHeight, 0x87CEEB).setDepth(0);
    
    // POLES - Brown with wires
    for(let i = 0; i < 5; i++){
        this.add.rectangle(150 + i * 200, window.innerHeight - 120, 30, 300, 0x8B4513).setDepth(1);
        this.add.rectangle(150 + i * 200, window.innerHeight - 270, 120, 6, 0x000).setDepth(1); // wires
    }
    
    // LINEMAN - BIG Red body + Yellow helmet
    player = this.add.rectangle(window.innerWidth / 2, window.innerHeight - 100, 40, 70, 0xFF0000).setDepth(3);
    this.add.circle(window.innerWidth / 2, window.innerHeight - 140, 18, 0xFFD700).setDepth(3);
    this.physics.add.existing(player);

    // BIRDS - Bigger black triangles
    for(let i = 0; i < 4; i++){
        let bird = this.add.triangle(200 + i * 220, 180 + i * 80, 0, 30, 30, 0, 15, 30, 0x000).setDepth(2);
        bird.setScale(1.5);
        this.physics.add.existing(bird);
        bird.body.velocity.x = -150;
        birds.push(bird);
    }

    // TOUCH CONTROLS
    document.getElementById('btnUp').ontouchstart = () => upPressed = true;
    document.getElementById('btnUp').ontouchend = () => upPressed = false;
    document.getElementById('btnDown').ontouchstart = () => downPressed = true;
    document.getElementById('btnDown').ontouchend = () => downPressed = false;
}

function update() {
    let speed = 3 + level * 0.5;
    
    if (upPressed && player.y > 120) {
        player.y -= speed;
        height += 0.3;
        score += 2;
    }
    if (downPressed && player.y < window.innerHeight - 100) player.y += speed;

    birds.forEach(bird => {
        bird.x += bird.body.velocity.x * 0.016;
        if(bird.x < -50) bird.x = window.innerWidth + 50;
        if(Phaser.Geom.Intersects.RectangleToRectangle(player.getBounds(), bird.getBounds())){
            gameOver(this);
        }
    });

    if(score > level * 400){ level++; }
    if(height < 0){ gameOver(this); }

    document.getElementById('ui').innerHTML = `<div>LINEMAN TRAINING PRO</div>Level: ${level} | Score: ${score} | Height: ${Math.floor(height)}m`;
}

function gameOver(scene){
    document.getElementById('gameOver').style.display = 'block';
    document.getElementById('finalScore').innerText = `Final Score: ${score} | Level: ${level}`;
    scene.scene.pause();
}
</script>
</body>
</html>
